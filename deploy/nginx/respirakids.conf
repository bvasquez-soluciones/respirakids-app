# Nginx como proxy inverso de RespiraKids.
# Dominio: respirakids.com. Certificados con Let's Encrypt (certbot).
# Instalar en /etc/nginx/sites-available/respirakids.conf y enlazar en sites-enabled.

limit_req_zone $binary_remote_addr zone=rk_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rk_auth:10m rate=10r/m;

upstream respirakids_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP -> HTTPS (excepto el reto de Let's Encrypt).
server {
    listen 80;
    listen [::]:80;
    server_name respirakids.com www.respirakids.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Sintaxis compatible con Nginx 1.24 (Ubuntu 24.04); en 1.25+ equivale a `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name respirakids.com www.respirakids.com;

    ssl_certificate     /etc/letsencrypt/live/respirakids.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/respirakids.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # La aplicación (Flask-Talisman) también envía cabeceras de seguridad; HSTS se fija aquí por si falla la app.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    client_max_body_size 5m;          # igual a MAX_CONTENT_LENGTH de la aplicación
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/respirakids.access.log;
    error_log  /var/log/nginx/respirakids.error.log warn;

    # Archivos estáticos servidos directamente por Nginx.
    location /static/ {
        alias /srv/respirakids/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    # Las fotos subidas no se listan ni se cachean como públicas.
    location /static/uploads/ {
        alias /srv/respirakids/app/static/uploads/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600";
    }

    # Límite más estricto para inicio de sesión y registro (complementa Flask-Limiter).
    location ~ ^/auth/(login|registro) {
        limit_req zone=rk_auth burst=5 nodelay;
        include /etc/nginx/snippets/respirakids-proxy.conf;
    }

    location / {
        limit_req zone=rk_general burst=40 nodelay;
        include /etc/nginx/snippets/respirakids-proxy.conf;
    }

    # Página de mantenimiento si la aplicación no responde.
    error_page 502 503 504 /mantenimiento.html;
    location = /mantenimiento.html {
        root /srv/respirakids/deploy/nginx;
        internal;
    }
}
