{% extends "base.html" %} {% block title %}Registrar Síntomas - RespiraKids{%
endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-1">Registrar Síntomas</h3>
        <p class="text-muted mb-4">Paciente: {{ nino.nombre_ficticio }}</p>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Temperatura (°C)</label>
            <input
              type="number"
              step="0.1"
              name="temperatura"
              class="form-control"
              placeholder="Ej. 37.5"
            />
          </div>

          <label class="form-label">Síntomas presentes</label>
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="tos"
                  id="tos"
                />
                <label class="form-check-label" for="tos">Tos</label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="dificultad_respiratoria"
                  id="dificultad_respiratoria"
                />
                <label class="form-check-label" for="dificultad_respiratoria"
                  >Dificultad respiratoria</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="respiracion_rapida"
                  id="respiracion_rapida"
                />
                <label class="form-check-label" for="respiracion_rapida"
                  >Respiración rápida</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="congestion_nasal"
                  id="congestion_nasal"
                />
                <label class="form-check-label" for="congestion_nasal"
                  >Congestión nasal</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="secrecion_nasal"
                  id="secrecion_nasal"
                />
                <label class="form-check-label" for="secrecion_nasal"
                  >Secreción nasal</label
                >
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="dolor_garganta"
                  id="dolor_garganta"
                />
                <label class="form-check-label" for="dolor_garganta"
                  >Dolor de garganta</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="decaimiento"
                  id="decaimiento"
                />
                <label class="form-check-label" for="decaimiento"
                  >Decaimiento</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="perdida_apetito"
                  id="perdida_apetito"
                />
                <label class="form-check-label" for="perdida_apetito"
                  >Pérdida de apetito</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="vomito"
                  id="vomito"
                />
                <label class="form-check-label" for="vomito">Vómito</label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="diarrea"
                  id="diarrea"
                />
                <label class="form-check-label" for="diarrea">Diarrea</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Otros síntomas (opcional)</label>
            <input type="text" name="otros_sintomas" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Observaciones (opcional)</label>
            <textarea
              name="observaciones"
              class="form-control"
              rows="3"
            ></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Guardar registro
          </button>
          <a
            href="{{ url_for('sintomas.listar', nino_id=nino.id) }}"
            class="btn btn-link w-100"
            >Cancelar</a
          >
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
