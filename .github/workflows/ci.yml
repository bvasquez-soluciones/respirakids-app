# Integración continua: cada push y pull request se valida antes de poder desplegarse.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y migraciones
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: respirakids
          POSTGRES_PASSWORD: respirakids_ci
          POSTGRES_DB: respirakids_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U respirakids" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RESPIRAKIDS_ENV: testing
      FLASK_APP: wsgi.py
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Migraciones sobre PostgreSQL desde cero
        env:
          TEST_DATABASE_URL: postgresql://respirakids:respirakids_ci@localhost:5432/respirakids_ci
        run: |
          flask db upgrade
          flask db check   # falla si los modelos tienen cambios sin migración
      - name: Pruebas automatizadas
        run: python -m pytest -q
      - name: Documento de reglas clínicas sincronizado
        run: |
          flask reglas documentar
          git diff --exit-code docs/REGLAS_CLINICAS_v1.md

  dependencias:
    name: Vulnerabilidades conocidas en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  despliegue:
    name: Despliegue de producción en Linux (Gunicorn + Nginx + respaldos)
    runs-on: ubuntu-24.04
    needs: pruebas
    services:
      postgres:
        image: postgres:16          # misma versión mayor que el cliente pg_dump del runner
        env:
          POSTGRES_USER: respirakids
          POSTGRES_PASSWORD: respirakids_ci
          POSTGRES_DB: respirakids_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U respirakids" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      RESPIRAKIDS_ENV: production
      FLASK_APP: wsgi.py
      DATABASE_URL: postgresql://respirakids:respirakids_ci@localhost:5432/respirakids_db
      RATELIMIT_STORAGE_URI: redis://localhost:6379/0
      # Solo para esta prueba técnica: NO representa una validación clínica de las reglas.
      REGLAS_CLINICAS_VALIDADAS: v1-aiepi
      PGHOST: localhost
      PGUSER: respirakids
      PGPASSWORD: respirakids_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Análisis estático de los scripts
        run: shellcheck deploy/scripts/*.sh
      - name: Instalar la aplicación como en el servidor (/srv/respirakids)
        run: |
          sudo ln -s "$GITHUB_WORKSPACE" /srv/respirakids
          # Nginx (www-data) necesita poder atravesar las carpetas del runner para servir los estáticos.
          sudo chmod o+x "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
          chmod -R o+rX app/static deploy/nginx
          python -m venv venv && venv/bin/pip install --quiet -r requirements.txt
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Migraciones y base de conocimiento
        run: |
          venv/bin/flask db upgrade
          venv/bin/flask conocimiento importar
      - name: Gunicorn con la configuración de producción
        run: |
          venv/bin/gunicorn wsgi:app --daemon --pid "$RUNNER_TEMP/gunicorn.pid" --access-logfile "$RUNNER_TEMP/access.log" --error-logfile "$RUNNER_TEMP/error.log"
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8000/salud && break; sleep 1; done
          curl --fail -s -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/salud | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/auth/login)" = 302   # obliga HTTPS
      - name: Nginx con HTTPS delante de Gunicorn
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx > /dev/null
          DOMINIO=respirakids.example.co
          sudo mkdir -p /etc/letsencrypt/live/$DOMINIO /var/www/certbot
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=$DOMINIO" \
            -keyout /etc/letsencrypt/live/$DOMINIO/privkey.pem -out /etc/letsencrypt/live/$DOMINIO/fullchain.pem
          sudo cp deploy/nginx/respirakids-proxy.conf /etc/nginx/snippets/
          sudo cp deploy/nginx/respirakids.conf /etc/nginx/sites-enabled/respirakids.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          RESOLVER="--resolve $DOMINIO:443:127.0.0.1 --resolve $DOMINIO:80:127.0.0.1"
          curl --fail -sk $RESOLVER https://$DOMINIO/salud | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' $RESOLVER http://$DOMINIO/auth/login)" = 301
          curl -skI $RESOLVER https://$DOMINIO/auth/login | grep -qi 'strict-transport-security'
          curl -skI $RESOLVER https://$DOMINIO/auth/login | grep -qi 'x-request-id'
          curl --fail -sk $RESOLVER https://$DOMINIO/static/css/base.css > /dev/null
      - name: Respaldo y restauración verificada
        run: |
          export DIR_RESPALDOS="$RUNNER_TEMP/respaldos" DIR_APP="$GITHUB_WORKSPACE"
          deploy/scripts/respaldo.sh
          ls -l "$DIR_RESPALDOS"
          (cd "$DIR_RESPALDOS" && sha256sum --check respirakids_*.sha256)
          deploy/scripts/restaurar.sh "$(ls "$DIR_RESPALDOS"/respirakids_db_*.dump)" respirakids_verificacion
          # El script debe negarse a restaurar sobre la base de producción.
          ! deploy/scripts/restaurar.sh "$(ls "$DIR_RESPALDOS"/respirakids_db_*.dump)" respirakids_db
      - name: Logs ante fallos
        if: failure()
        run: |
          tail -n 50 "$RUNNER_TEMP/error.log" "$RUNNER_TEMP/access.log" || true
          sudo tail -n 50 /var/log/nginx/error.log || true
